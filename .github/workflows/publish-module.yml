name: Publish Module

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Path under packages/ to the module to publish (e.g. "module/my-extension" or "modules/nice-modules/my-module")'
        type: string
        required: true
      dryRun:
        description: 'Dry run (npm publish --dry-run, no live publish)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODULE_PATH: packages/${{ inputs.module }}
      NPM_REGISTRY_HOST: shop-npm-registry.plentyone.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify module folder exists
        run: |
          MODULE_SUBPATH="${MODULE_PATH#packages/}"
          if [[ ! "$MODULE_SUBPATH" =~ ^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$ ]]; then
            echo "Invalid module path: '$MODULE_SUBPATH'. Only letters, numbers, hyphens, underscores, and '/' between segments are allowed (no '..', no leading '/', no dots)." >&2
            exit 1
          fi
          test -d "$MODULE_PATH" || { echo "No such folder: $MODULE_PATH"; exit 1; }

      - name: Validate marketplace.json
        run: |
          MARKETPLACE_JSON="$MODULE_PATH/marketplace.json"
          if [[ ! -f "$MARKETPLACE_JSON" ]]; then
            echo "Missing required file: marketplace.json" >&2
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const errors = [];

            const raw = fs.readFileSync(path, "utf-8");
            let pkg;
            try {
              pkg = JSON.parse(raw);
            } catch (e) {
              console.error(`marketplace.json is not valid JSON: ${e.message}`);
              process.exit(1);
            }

            const requiredLangs = ["en", "de"];

            const checkLocalizedString = (field) => {
              const value = pkg[field];
              if (!value || typeof value !== "object" || Array.isArray(value)) {
                errors.push(`"${field}" must be an object keyed by language ({ "en": ..., "de": ... })`);
                return;
              }
              const extraLangs = Object.keys(value).filter((lang) => !requiredLangs.includes(lang));
              if (extraLangs.length > 0) {
                errors.push(`"${field}" must only contain the languages ${requiredLangs.join(", ")}, found extra: ${extraLangs.join(", ")}`);
              }
              for (const lang of requiredLangs) {
                if (typeof value[lang] !== "string" || value[lang].trim() === "") {
                  errors.push(`"${field}.${lang}" is required and must be a non-empty string`);
                }
              }
            };

            checkLocalizedString("marketplaceName");
            checkLocalizedString("shortDescription");

            const priceMatch = raw.match(/"price"\s*:\s*(-?\d+(?:\.\d+)?)/);
            if (typeof pkg.price !== "number") {
              errors.push(`"price" is required and must be a number`);
            } else if (!priceMatch || !priceMatch[1].includes(".")) {
              errors.push(`"price" must be written as a float with a decimal point (e.g. 0.00 or 10.00), not a plain integer`);
            } else if (pkg.price !== 0 && pkg.price < 10) {
              errors.push(`"price" must be 0.00 (free) or at least 10.00 (paid), got ${pkg.price}`);
            }

            if (!Array.isArray(pkg.categories) || pkg.categories.length === 0) {
              errors.push(`"categories" is required and must be a non-empty array with at least one category ID`);
            }

            if (pkg.keywords !== undefined && !Array.isArray(pkg.keywords)) {
              errors.push(`"keywords" must be an array when present`);
            }

            if (errors.length > 0) {
              console.error("marketplace.json failed validation:");
              for (const e of errors) {
                console.error(`  - ${e}`);
              }
              process.exit(1);
            }

            console.log("marketplace.json passes validation.");
          ' "$MARKETPLACE_JSON"

      - name: Validate preview images
        run: |
          IMAGES_DIR="$MODULE_PATH/meta/images"
          MAX_BYTES=$((1024 * 1024))

          shopt -s nullglob
          previews=("$IMAGES_DIR"/preview_*.png)
          shopt -u nullglob

          count=${#previews[@]}
          if (( count < 1 || count > 7 )); then
            echo "Expected between 1 and 7 preview images (preview_<n>.png) in $IMAGES_DIR, found $count." >&2
            exit 1
          fi

          errors=()

          for img in "${previews[@]}"; do
            if ! file -b "$img" | grep -q "^PNG image data"; then
              errors+=("$img is not a valid PNG file")
              continue
            fi

            size=$(stat -c%s "$img")
            if (( size > MAX_BYTES )); then
              errors+=("$img is ${size} bytes, exceeds the 1 MB (1048576 byte) limit")
            fi
          done

          if [[ ${#errors[@]} -gt 0 ]]; then
            echo "Preview image validation failed:" >&2
            printf '  - %s\n' "${errors[@]}" >&2
            exit 1
          fi

          echo "Found $count preview image(s) in $IMAGES_DIR, all within limits."

      - name: Validate meta files
        run: |
          IMAGES_DIR="$MODULE_PATH/meta/images"
          missing=()
          errors=()

          check_file() {
            [[ -f "$MODULE_PATH/$1" ]] || missing+=("$1")
          }

          check_png_dimensions() {
            local file="$1" expected_w="$2" expected_h="$3" allow_shorter="$4"
            [[ -f "$file" ]] || return

            local info
            info=$(file -b "$file")
            if [[ "$info" != PNG\ image\ data* ]]; then
              errors+=("$file is not a valid PNG file")
              return
            fi

            local dims w h
            dims=$(grep -oE '[0-9]+ x [0-9]+' <<< "$info" | head -1)
            w="${dims%% x *}"
            h="${dims##* x }"

            if [[ "$w" != "$expected_w" ]]; then
              errors+=("$file has width ${w}px, expected ${expected_w}px")
            fi

            if [[ "$allow_shorter" == "true" ]]; then
              if (( h > expected_h )); then
                errors+=("$file has height ${h}px, expected at most ${expected_h}px")
              fi
            elif [[ "$h" != "$expected_h" ]]; then
              errors+=("$file has height ${h}px, expected ${expected_h}px")
            fi
          }

          check_file "package.json"

          for subject in author plugin; do
            for size in xs sm md; do
              check_file "meta/images/icon_${subject}_${size}.png"
            done
          done

          # Author icon must be exactly square at each fixed size.
          check_png_dimensions "$IMAGES_DIR/icon_author_xs.png" 32 32 false
          check_png_dimensions "$IMAGES_DIR/icon_author_sm.png" 256 256 false
          check_png_dimensions "$IMAGES_DIR/icon_author_md.png" 512 512 false

          # Plugin icon may be rectangular: width is fixed, height may only be reduced.
          check_png_dimensions "$IMAGES_DIR/icon_plugin_xs.png" 32 32 true
          check_png_dimensions "$IMAGES_DIR/icon_plugin_sm.png" 256 256 true
          check_png_dimensions "$IMAGES_DIR/icon_plugin_md.png" 512 512 true

          for doc in support_contact changelog user_guide; do
            for lang in en de; do
              path="meta/documents/${doc}_${lang}.md"
              check_file "$path"
              if [[ -f "$MODULE_PATH/$path" && ! -s "$MODULE_PATH/$path" ]]; then
                errors+=("$path exists but is empty")
              fi
            done
          done

          support_contact_en="$MODULE_PATH/meta/documents/support_contact_en.md"
          if [[ -f "$support_contact_en" ]] && ! grep -q '@' "$support_contact_en"; then
            errors+=("meta/documents/support_contact_en.md must include a support email address")
          fi

          if [[ ${#missing[@]} -gt 0 || ${#errors[@]} -gt 0 ]]; then
            echo "Module package \"$MODULE_PATH\" failed meta file validation:" >&2
            for m in "${missing[@]}"; do echo "  - missing: $m" >&2; done
            printf '  - %s\n' "${errors[@]}" >&2
            exit 1
          fi

          echo "Module package \"$MODULE_PATH\" passes meta file validation."

      - name: Install dependencies
        run: npm ci

      - name: Build module
        run: npx turbo run build --filter="./$MODULE_PATH"

      - name: Configure npm auth
        run: |
          AUTH=$(printf '%s:%s' "$NPM_USERNAME" "$NPM_PASSWORD" | base64)
          {
            echo "//${NPM_REGISTRY_HOST}/:_auth=${AUTH}"
            echo "//${NPM_REGISTRY_HOST}/:always-auth=true"
          } >> "$MODULE_PATH/.npmrc"
        env:
          NPM_USERNAME: ${{ secrets.PLENTY_MARKETPLACE_NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.PLENTY_MARKETPLACE_NPM_PASSWORD }}

      - name: Publish
        working-directory: ${{ env.MODULE_PATH }}
        run: npm publish --registry "https://${NPM_REGISTRY_HOST}" ${{ inputs.dryRun && '--dry-run' || '' }}

      - name: Upload npm debug log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-debug-log
          path: /home/runner/.npm/_logs/*-debug-0.log
          retention-days: 7

      - name: Clean up npm auth
        if: always()
        run: rm -f "$MODULE_PATH/.npmrc"
